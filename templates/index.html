<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Трекер откликов</title>
<script>
  // До отрисовки: сохранённый выбор, иначе системная тема
  (() => {
    let saved = null;
    try { saved = localStorage.getItem("theme"); } catch (e) {}
    const dark = saved ? saved === "dark"
      : window.matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.dataset.theme = dark ? "dark" : "light";
  })();
</script>
<style>
  :root {
    color-scheme: light;
    --bg: #fff;
    --surface: #f7f7f6;      /* карточки, подсветка строк */
    --raised: #fff;          /* модалка, кнопки, поля ввода */
    --dark: #302722;         /* фон активной кнопки */
    --on-dark: #fff;
    --ink: #2b241f;
    --muted: #6b615a;
    --faint: #b3aca6;        /* «не указана», плейсхолдеры */
    --accent: #b0561f;
    --accent-soft: #fdf6f1;  /* фон плашек с акцентом */
    --accent-hover: #fff8f2;
    --line: #e3ded9;
    --ok: #2f7d4f;
    --ok-soft: #eaf5ee;
    --ok-ink: #235c3a;
    --on-ok: #fff;
    --say-soft: #f2f8f4;     /* «говорим так» */
    --truth-soft: #fdf4f4;   /* «как было на самом деле» */
    --truth-ink: #7a3a3a;
    --summary-bg: #fbf9f8;
    --overlay: rgba(30, 24, 20, 0.55);

    --st-researched-bg: #eee9e4; --st-researched-ink: #6b615a;
    --st-applied-bg:    #fde8d8; --st-applied-ink:    #a04d18;
    --st-screening-bg:  #dfe8fb; --st-screening-ink:  #2c4f9e;
    --st-interview-bg:  #e0f0e5; --st-interview-ink:  #2f7d4f;
    --st-offer-bg:      #2f7d4f; --st-offer-ink:      #fff;
    --st-rejected-bg:   #f6dede; --st-rejected-ink:   #9a3232;
    --st-muted-bg:      #efefef; --st-muted-ink:      #888;
    --st-reserve-bg:    #f3ecd8; --st-reserve-ink:    #8a6d1f;
    --aud-hr-bg:        #dfe8fb; --aud-hr-ink:        #2c4f9e;
    --aud-tech-bg:      #e8e2f5; --aud-tech-ink:      #57409c;
  }

  /* Тёмная тема. Атрибут data-theme проставляется до отрисовки, поэтому
     белой вспышки при загрузке нет. color-scheme переводит в тёмное и
     системные элементы: скроллбары, выпадающие списки, поля ввода. */
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #17130f;
    --surface: #201a16;
    --raised: #251e19;
    --dark: #e8ddd4;
    --on-dark: #201a16;
    --ink: #ece4dc;
    --muted: #a2968b;
    --faint: #6e635a;
    --accent: #e08b4e;
    --accent-soft: #2b2018;
    --accent-hover: #2a2019;
    --line: #362d26;
    --ok: #4fa876;
    --ok-soft: #1c2c22;
    --ok-ink: #8fd0a8;
    --on-ok: #102016;
    --say-soft: #1b2a20;
    --truth-soft: #2d1e1e;
    --truth-ink: #e2a5a5;
    --summary-bg: #221c17;
    --overlay: rgba(0, 0, 0, 0.7);

    --st-researched-bg: #2c2621; --st-researched-ink: #ab9e92;
    --st-applied-bg:    #3a2617; --st-applied-ink:    #e8a86e;
    --st-screening-bg:  #1e2740; --st-screening-ink:  #9bb8ee;
    --st-interview-bg:  #1c2c22; --st-interview-ink:  #86cca1;
    --st-offer-bg:      #2f7d4f; --st-offer-ink:      #fff;
    --st-rejected-bg:   #3a2020; --st-rejected-ink:   #e8a2a2;
    --st-muted-bg:      #2a2724; --st-muted-ink:      #918879;
    --st-reserve-bg:    #322a17; --st-reserve-ink:    #dcc175;
    --aud-hr-bg:        #1e2740; --aud-hr-ink:        #9bb8ee;
    --aud-tech-bg:      #272040; --aud-tech-ink:      #b8a8ee;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 "Segoe UI", system-ui, sans-serif; }
  .wrap { max-width: 76rem; margin: 0 auto; padding: 1.5rem clamp(1rem, 3vw, 2rem) 4rem; }
  h1 { font-size: 1.6rem; margin: 0 0 0.3rem; }
  .sub { color: var(--muted); margin-bottom: 1.5rem; }
  .head-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; }
  .theme-toggle { font: inherit; font-size: 1.1rem; line-height: 1; padding: 0.4rem 0.6rem; border: 1px solid var(--line);
                  background: var(--raised); color: inherit; border-radius: 999px; cursor: pointer; flex: none; }
  .theme-toggle:hover { border-color: var(--accent); }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 0.9rem 1.1rem; }
  .card b { display: block; font-size: 1.7rem; line-height: 1.1; color: var(--accent); }
  .card span { color: var(--muted); font-size: 0.88rem; }

  .alerts { display: grid; gap: 0.6rem; margin-bottom: 1.5rem; }
  .alert { border-left: 3px solid var(--accent); background: var(--accent-soft); padding: 0.6rem 0.9rem; border-radius: 0 8px 8px 0; font-size: 0.92rem; }

  .filters { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem; align-items: center; }
  .filters button, .filters input {
    font: inherit; padding: 0.35rem 0.85rem; border: 1px solid var(--line);
    border-radius: 999px; background: var(--raised); color: inherit; cursor: pointer;
  }
  .filters button.active { background: var(--dark); color: var(--on-dark); border-color: var(--dark); }
  .filters input { cursor: text; min-width: 14rem; }

  table { width: 100%; border-collapse: collapse; font-size: 0.93rem; }
  th, td { text-align: left; padding: 0.6rem 0.5rem; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
  tr:hover td { background: var(--surface); }
  .company { font-weight: 600; }
  .note { color: var(--muted); font-size: 0.86rem; display: block; margin-top: 0.2rem; }
  .pill { display: inline-block; padding: 0.1rem 0.6rem; border-radius: 999px; font-size: 0.78rem; font-weight: 600; white-space: nowrap; }
  .s-researched { background: var(--st-researched-bg); color: var(--st-researched-ink); }
  .s-applied    { background: var(--st-applied-bg); color: var(--st-applied-ink); }
  .s-screening  { background: var(--st-screening-bg); color: var(--st-screening-ink); }
  .s-interview  { background: var(--st-interview-bg); color: var(--st-interview-ink); }
  .s-offer      { background: var(--st-offer-bg); color: var(--st-offer-ink); }
  .s-rejected   { background: var(--st-rejected-bg); color: var(--st-rejected-ink); }
  .s-declined, .s-skipped { background: var(--st-muted-bg); color: var(--st-muted-ink); }
  .s-reserve    { background: var(--st-reserve-bg); color: var(--st-reserve-ink); }
  .prio { font-weight: 700; color: var(--accent); }
  .row-actions select, .row-actions button { font: inherit; font-size: 0.85rem; padding: 0.2rem 0.4rem; }
  .row-actions { white-space: nowrap; }
  .empty { padding: 2rem; text-align: center; color: var(--muted); }
  .faint { color: var(--faint); }
  select, textarea, input { background: var(--raised); color: inherit; border-color: var(--line); }

  /* Фидбек: правится по клику прямо в таблице */
  .fb { cursor: text; min-height: 1.2rem; font-size: 0.86rem; color: var(--ink); }
  .fb:hover { background: var(--accent-hover); outline: 1px dashed var(--line); }
  .fb.empty-fb { color: var(--faint); font-style: italic; }
  .fb textarea { font: inherit; width: 100%; min-height: 4.5rem; border: 1px solid var(--accent); border-radius: 6px; padding: 0.3rem; background: var(--raised); color: inherit; }
  .fb-presets { font: inherit; font-size: 0.8rem; margin-top: 0.25rem; width: 100%; border: 1px solid var(--line); border-radius: 6px; padding: 0.15rem; cursor: pointer; }

  /* Кнопка рассказа о себе */
  .pitch-btn { border: 1px solid var(--ok); background: var(--ok-soft); color: var(--ok-ink); border-radius: 999px;
               cursor: pointer; font-weight: 600; white-space: nowrap; margin-top: 0.3rem; display: block; }
  .pitch-btn:hover { background: var(--ok); color: var(--on-ok); }

  /* Окно самопрезентации */
  .modal { position: fixed; inset: 0; z-index: 50; background: var(--overlay); display: grid; place-items: center; padding: 1.5rem; }
  .modal[hidden] { display: none; }
  .modal-box { background: var(--raised); border-radius: 14px; max-width: 54rem; width: 100%; max-height: 88vh; overflow: auto; padding: 1.5rem clamp(1rem, 3vw, 2rem) 2rem; }
  .modal-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; border-bottom: 1px solid var(--line); padding-bottom: 0.8rem; margin-bottom: 1rem; }
  .modal-head h2 { margin: 0; font-size: 1.25rem; }
  .modal-head p { margin: 0.2rem 0 0; color: var(--muted); font-size: 0.9rem; }
  .modal-close { border: 1px solid var(--line); background: var(--raised); color: inherit; border-radius: 50%; width: 2rem; height: 2rem; font-size: 1.1rem; cursor: pointer; flex: none; }

  .lengths { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 0.6rem; align-items: center; }
  .lengths button { font: inherit; font-size: 0.86rem; padding: 0.3rem 0.8rem; border: 1px solid var(--line); background: var(--raised); color: inherit; border-radius: 999px; cursor: pointer; }
  .lengths button.active { background: var(--dark); color: var(--on-dark); border-color: var(--dark); }
  .tabs-label { font-size: 0.82rem; color: var(--muted); min-width: 8.5rem; }
  #audiences { margin-bottom: 1.2rem; }

  .aud-tag { font-size: 0.72rem; font-weight: 600; padding: 0.05rem 0.4rem; border-radius: 999px; margin-left: 0.3rem; vertical-align: 0.08em; }
  .aud-hr { background: var(--aud-hr-bg); color: var(--aud-hr-ink); }
  .aud-tech { background: var(--aud-tech-bg); color: var(--aud-tech-ink); }

  /* Причина ухода: два слоя */
  .reason { margin-top: 0.7rem; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .reason .say { padding: 0.5rem 0.7rem; background: var(--say-soft); font-size: 0.91rem; }
  .reason .say b { color: var(--ok-ink); }
  .reason details { border-top: 1px solid var(--line); }
  .reason summary { padding: 0.4rem 0.7rem; cursor: pointer; font-size: 0.85rem; color: var(--muted); background: var(--summary-bg); }
  .reason .truth { padding: 0.5rem 0.7rem; font-size: 0.88rem; white-space: pre-line; color: var(--truth-ink); background: var(--truth-soft); }

  .qs { border-top: 1px solid var(--line); margin-top: 1.2rem; padding-top: 1rem; }
  .qs h4 { margin: 0 0 0.5rem; font-size: 0.95rem; }
  .qs ol { margin: 0 0 1.1rem; padding-left: 1.3rem; }
  .qs li { margin-bottom: 0.55rem; font-size: 0.93rem; }
  .qs li span { display: block; color: var(--muted); font-size: 0.85rem; margin-top: 0.1rem; }
  .asks { background: var(--accent-soft); border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0; padding: 0.6rem 0.9rem; margin-bottom: 1rem; font-size: 0.9rem; }
  .asks b { display: block; margin-bottom: 0.3rem; }
  .asks ul { margin: 0; padding-left: 1.1rem; }

  .focus-box { background: var(--accent-soft); border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0; padding: 0.7rem 1rem; margin-bottom: 1.2rem; font-size: 0.92rem; }
  .focus-box b { display: block; margin-bottom: 0.2rem; }
  .focus-box .drop { color: var(--muted); margin-top: 0.4rem; }

  .brick { border-left: 3px solid var(--line); padding: 0 0 0 1rem; margin-bottom: 1.3rem; }
  .brick h3 { margin: 0 0 0.1rem; font-size: 0.98rem; }
  .brick .period { color: var(--muted); font-size: 0.82rem; }
  .brick .core { margin: 0.45rem 0 0; font-size: 1rem; }
  .brick .hint { color: var(--muted); font-size: 0.84rem; margin-top: 0.4rem; font-style: italic; }
  .brick ul { margin: 0.6rem 0 0; padding-left: 1.1rem; }
  .brick li { margin-bottom: 0.45rem; font-size: 0.93rem; }
  .brick li b { color: var(--accent); }
  .brick li.fit { background: var(--ok-soft); border-radius: 6px; padding: 0.2rem 0.4rem; margin-left: -0.4rem; }
  .brick li.fit b { color: var(--ok-ink); }

  .tips { border-top: 1px solid var(--line); margin-top: 1.2rem; padding-top: 1rem; }
  .tips h4 { margin: 0 0 0.4rem; font-size: 0.92rem; }
  .tips ul { margin: 0 0 1rem; padding-left: 1.1rem; }
  .tips li { font-size: 0.9rem; margin-bottom: 0.35rem; }
  .tips li span { color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <div class="head-row">
    <div>
      <h1>Трекер откликов</h1>
      <p class="sub">Вакансии, статусы, события и сроки в одном месте · <a href="/calendar.ics">📅 в календарь (.ics)</a></p>
    </div>
    <button class="theme-toggle" type="button" id="themeToggle" title="Переключить тему"></button>
  </div>

  <div class="stats" id="stats"></div>
  <div class="alerts" id="alerts"></div>

  <div class="filters" id="filters">
    <button data-status="" class="active">Все</button>
    <button data-status="researched">Разобраны</button>
    <button data-status="applied">Отклик отправлен</button>
    <button data-status="screening">Скрининг</button>
    <button data-status="interview">Интервью</button>
    <button data-status="reserve">Резерв</button>
    <button data-status="skipped">Пропущены</button>
    <input id="search" type="search" placeholder="Поиск по компании или роли">
  </div>

  <table>
    <thead>
      <tr>
        <th style="width:3rem">Пр.</th>
        <th>Компания и роль</th>
        <th style="width:9rem">Статус</th>
        <th style="width:6rem">Формат</th>
        <th style="width:7rem">Зарплата</th>
        <th style="width:14rem">Фидбек</th>
        <th style="width:12rem">Действие</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="empty" id="empty" hidden>Ничего не найдено</div>
</div>

<div class="modal" id="pitchModal" hidden role="dialog" aria-modal="true" aria-labelledby="pitchTitle">
  <div class="modal-box">
    <div class="modal-head">
      <div>
        <h2 id="pitchTitle">Рассказ о себе</h2>
        <p id="pitchFor"></p>
      </div>
      <button class="modal-close" type="button" aria-label="Закрыть" onclick="closePitch()">×</button>
    </div>
    <div class="lengths" id="lengths">
      <span class="tabs-label">Сколько времени:</span>
      <button data-len="short">40 секунд</button>
      <button data-len="standard" class="active">2 минуты</button>
      <button data-len="full">4-5 минут</button>
    </div>
    <div class="lengths" id="audiences">
      <span class="tabs-label">Кто слушает:</span>
      <button data-aud="hr">HR</button>
      <button data-aud="tech">Техсобес</button>
      <button data-aud="both" class="active">Всё вместе</button>
    </div>
    <div id="pitchBody"></div>
  </div>
</div>

<script>
const STATUS_LABEL = {
  researched: "разобрана", applied: "отклик отправлен", screening: "скрининг",
  interview: "интервью", offer: "оффер", rejected: "отказ",
  declined: "отказался сам", skipped: "пропущена", reserve: "резерв",
};
const FORMAT_LABEL = { office: "офис", hybrid: "гибрид", remote: "удалёнка", unknown: "-" };
const EVENTS = {
  applied: "отклик отправлен", questionnaire: "прислали анкету", reply: "ответ рекрутёра",
  call: "созвон", interview: "интервью", test_task: "тестовое",
  offer: "оффер", rejection: "отказ", note: "заметка",
};

// Статусы, где уже есть контакт с работодателем: показываем кнопку рассказа о себе
const SHOW_PITCH = new Set(["screening", "interview", "offer"]);
const TRACK_LABEL = { dev: "C#/.NET разработчик", support: "поддержка, 2-3 линия", ai: "ИИ-инженер, автоматизация" };

let currentStatus = "";
let currentSearch = "";
let pitchVacancyId = null;
let pitchLength = "standard";
let pitchAudience = "both";

// Готовые пометки для колонки фидбека - самые частые случаи
const FEEDBACK_PRESETS = [
  "Ответил на вопросы ИИ-помощника",
  "Ответил на вопросы скрининга",
  "Заполнил форму",
  "Отправил анкету",
  "Прошёл онлайн-интервью",
  "Ответа нет",
];

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const money = (v) => v ? (v / 1000).toFixed(0) + "к" : null;

function salaryText(v) {
  const lo = money(v.salary_min), hi = money(v.salary_max);
  if (lo && hi && lo !== hi) return `${lo}-${hi}`;
  if (lo && v.salary_note === "от") return `от ${lo}`;
  if (lo) return lo;
  return "<span class='faint'>не указана</span>";
}

async function loadStats() {
  const s = await (await fetch("/api/stats")).json();
  document.getElementById("stats").innerHTML = `
    <div class="card"><b>${s.total}</b><span>вакансий в базе</span></div>
    <div class="card"><b>${s.applied_count}</b><span>откликов отправлено</span></div>
    <div class="card"><b>${s.reply_rate}%</b><span>дали ответ</span></div>
    <div class="card"><b>${s.by_status.interview || 0}</b><span>дошли до интервью</span></div>`;

  const alerts = [];
  if (s.stale.length) {
    alerts.push(`<div class="alert"><b>Без ответа больше недели (${s.stale.length}):</b> ` +
      s.stale.map(v => v.company.name).join(", ") + "</div>");
  }
  if (s.upcoming.length) {
    alerts.push(`<div class="alert"><b>Ближайшие действия:</b> ` +
      s.upcoming.map(v => `${v.company.name} - ${v.next_action || "проверить"} (${v.next_action_at})`).join("; ") + "</div>");
  }
  document.getElementById("alerts").innerHTML = alerts.join("");
}

async function loadRows() {
  const params = new URLSearchParams();
  if (currentStatus) params.set("status", currentStatus);
  if (currentSearch.length > 1) params.set("search", currentSearch);
  const list = await (await fetch("/api/vacancies?" + params)).json();

  document.getElementById("empty").hidden = list.length > 0;
  document.getElementById("rows").innerHTML = list.map(v => `
    <tr>
      <td class="prio">${v.priority}</td>
      <td>
        <span class="company">${esc(v.company.name)}</span> - ${esc(v.title)}
        ${v.match_note ? `<span class="note">${esc(v.match_note.slice(0, 120))}</span>` : ""}
      </td>
      <td><span class="pill s-${v.status}">${STATUS_LABEL[v.status] || v.status}</span></td>
      <td>${FORMAT_LABEL[v.work_format]}</td>
      <td>${salaryText(v)}</td>
      <td>
        <div class="fb ${v.feedback ? "" : "empty-fb"}" onclick="editFeedback(this, ${v.id})"
             title="Нажмите, чтобы записать фидбек">${v.feedback ? esc(v.feedback) : "записать фидбек"}</div>
      </td>
      <td class="row-actions">
        <select onchange="addEvent(${v.id}, this.value); this.value='';">
          <option value="">+ событие</option>
          ${Object.entries(EVENTS).map(([k, label]) => `<option value="${k}">${label}</option>`).join("")}
        </select>
        ${SHOW_PITCH.has(v.status)
          ? `<button class="pitch-btn" onclick="openPitch(${v.id})">🎤 рассказ о себе</button>` : ""}
      </td>
    </tr>`).join("");
}

// --- Фидбек правится прямо в таблице ---
async function editFeedback(cell, vacancyId) {
  if (cell.querySelector("textarea")) return;
  const current = cell.classList.contains("empty-fb") ? "" : cell.textContent.trim();
  cell.innerHTML = "";
  const area = document.createElement("textarea");
  area.value = current;
  area.placeholder = "Что сказали или что сделал на этом этапе";
  cell.appendChild(area);

  // Быстрые заготовки: клик дописывает строку, не затирая уже написанное
  const presets = document.createElement("select");
  presets.className = "fb-presets";
  presets.innerHTML = '<option value="">+ готовая пометка</option>' +
    FEEDBACK_PRESETS.map(p => `<option value="${p}">${p}</option>`).join("");
  presets.onchange = () => {
    if (!presets.value) return;
    const stamp = new Date().toLocaleDateString("ru-RU", { day: "2-digit", month: "2-digit" });
    area.value = (area.value.trim() ? area.value.trim() + "\n" : "") + `${stamp}: ${presets.value}`;
    presets.value = "";
    area.focus();
  };
  presets.onmousedown = () => clearTimeout(blurTimer);
  cell.appendChild(presets);
  area.focus();

  let blurTimer;
  let cancelled = false;

  const save = async () => {
    if (cancelled) return;
    const value = area.value.trim();
    if (value !== current) {
      await fetch(`/api/vacancies/${vacancyId}`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ feedback: value || null }),
      });
    }
    loadRows();
  };

  // Сохраняем с задержкой: клик по списку заготовок не должен закрывать поле
  const onBlur = () => { blurTimer = setTimeout(save, 150); };
  area.addEventListener("blur", onBlur);
  presets.addEventListener("blur", onBlur);
  area.addEventListener("focus", () => clearTimeout(blurTimer));

  area.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { cancelled = true; clearTimeout(blurTimer); loadRows(); }
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { clearTimeout(blurTimer); save(); }
  });
}

async function addEvent(vacancyId, type) {
  if (!type) return;
  const title = prompt("Что произошло?", EVENTS[type]);
  if (title === null) return;
  await fetch(`/api/vacancies/${vacancyId}/events`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ type, title: title || EVENTS[type] }),
  });
  refresh();
}

// --- Рассказ о себе ---
async function openPitch(vacancyId) {
  pitchVacancyId = vacancyId;
  document.getElementById("pitchModal").hidden = false;
  document.body.style.overflow = "hidden";
  await renderPitch();
}

function closePitch() {
  document.getElementById("pitchModal").hidden = true;
  document.body.style.overflow = "";
  pitchVacancyId = null;
}

async function renderPitch() {
  const p = await (await fetch(
    `/api/vacancies/${pitchVacancyId}/pitch?length=${pitchLength}&audience=${pitchAudience}`)).json();

  document.getElementById("pitchFor").textContent =
    `${p.company} - ${p.vacancy_title} · ${p.length_label} · ${p.audience_label}` +
    (p.track ? ` · акценты под «${TRACK_LABEL[p.track] || p.track}»` : " · тип вакансии не определён");

  const parts = [];

  if (p.focus) {
    parts.push(`<div class="focus-box">
      <b>Что подчеркнуть: ${esc(p.focus.title)}</b>
      ${esc(p.focus.emphasize)}
      <div class="drop">Убрать: ${esc(p.focus.drop)}</div>
    </div>`);
  } else {
    parts.push(`<div class="focus-box"><b>Тип вакансии не определён</b>
      Акценты не подобраны - рассказ собран нейтрально. Проставьте трек вакансии, чтобы добавки
      подбирались под неё.</div>`);
  }

  const audTag = (a) => a === "both" ? ""
    : `<span class="aud-tag aud-${a}">${a === "hr" ? "для HR" : "для техсобеса"}</span>`;

  parts.push(p.blocks.map(b => `
    <div class="brick">
      <h3>${esc(b.title)}</h3>
      ${b.period ? `<div class="period">${esc(b.period)}</div>` : ""}
      <p class="core">${esc(b.core_line)}</p>
      ${b.addons.length ? `<ul>${b.addons.map(a =>
        `<li class="${a.fits_track ? "fit" : ""}"><b>${esc(a.label)}:</b> ${esc(a.text)}${audTag(a.audience)}</li>`
      ).join("")}</ul>` : ""}
      ${b.reason_public ? `<div class="reason">
        <div class="say"><b>Почему ушёл - говорим так:</b> ${esc(b.reason_public)}</div>
        ${b.reason_real ? `<details>
          <summary>Как было на самом деле (вслух не произносим)</summary>
          <div class="truth">${esc(b.reason_real)}</div>
        </details>` : ""}
      </div>` : ""}
      ${b.hint ? `<div class="hint">${esc(b.hint)}</div>` : ""}
    </div>`).join(""));

  const list = (items, render) => items.map(render).join("");

  // Вопросы: что спросить на этом этапе
  if (p.probe.length || p.interest.length || p.vacancy_asks.length) {
    const stage = p.audience === "hr" ? "на HR-этапе"
                : p.audience === "tech" ? "на техсобесе" : "на собеседовании";
    parts.push(`<div class="qs">
      <h4>Что спросить ${stage}</h4>
      ${p.vacancy_asks.length ? `<div class="asks"><b>Именно по этой вакансии:</b>
        <ul>${list(p.vacancy_asks, a => `<li>${esc(a)}</li>`)}</ul></div>` : ""}
      ${p.probe.length ? `<h4>Узнать важное для решения</h4>
        <ol>${list(p.probe, q => `<li>${esc(q.text)}<span>${esc(q.note || "")}</span></li>`)}</ol>` : ""}
      ${p.interest.length ? `<h4>Показать заинтересованность</h4>
        <ol>${list(p.interest, q => `<li>${esc(q.text)}<span>${esc(q.note || "")}</span></li>`)}</ol>` : ""}
    </div>`);
  }

  parts.push(`<div class="tips">
    <h4>Крючки - сказать коротко и ждать вопроса</h4>
    <ul>${list(p.hooks, t => `<li>${esc(t.title)} <span>${esc(t.body || "")}</span></li>`)}</ul>
    <h4>Частые продолжения</h4>
    <ul>${list(p.faq, t => `<li><b>${esc(t.title)}</b> <span>${esc(t.body || "")}</span></li>`)}</ul>
    <h4>Чего избегать</h4>
    <ul>${list(p.avoid, t => `<li>${esc(t.title)} <span>${esc(t.body || "")}</span></li>`)}</ul>
  </div>`);

  document.getElementById("pitchBody").innerHTML = parts.join("");
}

document.getElementById("lengths").addEventListener("click", (e) => {
  const button = e.target.closest("button[data-len]");
  if (!button) return;
  document.querySelectorAll("#lengths button").forEach(b => b.classList.remove("active"));
  button.classList.add("active");
  pitchLength = button.dataset.len;
  renderPitch();
});

document.getElementById("audiences").addEventListener("click", (e) => {
  const button = e.target.closest("button[data-aud]");
  if (!button) return;
  document.querySelectorAll("#audiences button").forEach(b => b.classList.remove("active"));
  button.classList.add("active");
  pitchAudience = button.dataset.aud;
  renderPitch();
});

document.getElementById("pitchModal").addEventListener("click", (e) => {
  if (e.target.id === "pitchModal") closePitch();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && !document.getElementById("pitchModal").hidden) closePitch();
});

function refresh() { loadStats(); loadRows(); }

document.getElementById("filters").addEventListener("click", (e) => {
  const button = e.target.closest("button[data-status]");
  if (!button) return;
  document.querySelectorAll("#filters button").forEach(b => b.classList.remove("active"));
  button.classList.add("active");
  currentStatus = button.dataset.status;
  loadRows();
});

let searchTimer;
document.getElementById("search").addEventListener("input", (e) => {
  clearTimeout(searchTimer);
  currentSearch = e.target.value.trim();
  searchTimer = setTimeout(loadRows, 250);
});

// --- Переключение темы ---
const themeButton = document.getElementById("themeToggle");

function paintThemeButton() {
  const dark = document.documentElement.dataset.theme === "dark";
  themeButton.textContent = dark ? "☀️" : "🌙";
  themeButton.setAttribute("aria-label", dark ? "Включить светлую тему" : "Включить тёмную тему");
}

themeButton.addEventListener("click", () => {
  const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("theme", next); } catch (e) {}
  paintThemeButton();
});

paintThemeButton();
refresh();
</script>
